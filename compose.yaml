services:
  app:
    build: .
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      # The slim image has no curl, so ask Python to call /health.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
