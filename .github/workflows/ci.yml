name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        # --locked fails if uv.lock is out of date with pyproject.toml
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t data-analyst-agent .

      - name: Start container and call /health
        run: |
          docker run -d --name app -p 8000:8000 data-analyst-agent
          for i in $(seq 1 15); do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 1
          done
          docker logs app
          exit 1

  publish:
    # Only after a merge to main, and only if the checks above passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # lets the built-in token push to GitHub Container Registry
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image
        # Two tags: the commit hash (exact, never moves) and latest (what the server pulls).
        # The label links the image to this repo on GitHub.
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            .

      - name: Push image
        run: docker push --all-tags "$IMAGE"

  deploy:
    # Skipped until the AWS setup in docs/deploy.md is done and the repo variables exist.
    if: vars.EC2_INSTANCE_ID != ''
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write # lets this job prove its identity to AWS (OIDC), so no AWS keys are stored
      contents: read
    steps:
      - name: Get temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Tell the instance to pull and restart
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          RAW: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/deploy
        run: |
          # The shell commands the instance will run, as the JSON that SSM expects.
          PARAMS=$(jq -n --arg raw "$RAW" --arg tag "$GITHUB_SHA" '{commands: [
            "set -eu",
            "cd /opt/app",
            "curl -fsSL \($raw)/compose.yaml -o compose.yaml",
            "curl -fsSL \($raw)/Caddyfile -o Caddyfile",
            "export IMAGE_TAG=\($tag)",
            "docker compose pull -q",
            "docker compose up -d --remove-orphans",
            "for i in $(seq 1 30); do curl -fsS http://localhost/health && exit 0; sleep 2; done",
            "docker compose ps; docker compose logs --tail 50; exit 1"
          ]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy $GITHUB_SHA" \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)

          # Poll until the command finishes (up to 5 minutes), then show what happened.
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending | InProgress | Delayed) sleep 5 ;;
              *) break ;;
            esac
          done
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "[StandardOutputContent, StandardErrorContent]" --output text
          echo "Deploy status: $STATUS"
          test "$STATUS" = "Success"
