name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        # --locked fails if uv.lock is out of date with pyproject.toml
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t data-analyst-agent .

      - name: Start container and call /health
        run: |
          docker run -d --name app -p 8000:8000 data-analyst-agent
          for i in $(seq 1 15); do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 1
          done
          docker logs app
          exit 1
